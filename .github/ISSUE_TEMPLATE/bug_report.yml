name: Bug report
description: Report a reproducible PowerModeMenu problem without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, Touch ID data, private power snapshots, or other credentials. Report security issues privately as described in SECURITY.md.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.6"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Intended mode
      options:
        - Home / keep running
        - Away / normal sleep
        - Unknown
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include exact visible messages and sanitized read-only output when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
